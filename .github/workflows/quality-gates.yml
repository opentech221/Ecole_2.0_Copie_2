name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec eslint .
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Security audit gate
        run: |
          pnpm audit --json > audit.json || true
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const ignoredAdvisories = [{ module: "react-router", titleIncludes: "RSC Mode CSRF Bypass" }];

          const isIgnored = (advisory) =>
            ignoredAdvisories.some(
              (rule) =>
                advisory?.module_name === rule.module &&
                String(advisory?.title || "").includes(rule.titleIncludes),
            );

          const advisories = Object.values(report?.advisories ?? {});
          const effectiveAdvisories = advisories.filter((advisory) => !isIgnored(advisory));

          if (effectiveAdvisories.length > 0) {
            console.error("Vulnerabilities detected:", effectiveAdvisories.length);
            process.exit(1);
          }

          if (advisories.length > 0) {
            console.log("No actionable vulnerabilities detected");
            process.exit(0);
          }

          const vulnerabilities = report?.metadata?.vulnerabilities ?? {};
          const total =
            typeof vulnerabilities.total === "number"
              ? vulnerabilities.total
              : ["info", "low", "moderate", "high", "critical"].reduce(
                  (sum, key) => sum + (typeof vulnerabilities[key] === "number" ? vulnerabilities[key] : 0),
                  0,
                );
          if (total > 0) {
            console.error("Vulnerabilities detected:", total);
            process.exit(1);
          }
          console.log("No vulnerabilities detected");
          NODE
